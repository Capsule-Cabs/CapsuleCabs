<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Capsule Cabs | Reliable Cab Booking Service</title>
    <meta
      name="description"
      content="Capsule Cabs offers reliable and affordable cab booking services."
    />
    <meta name="author" content="Capsule Cabs" />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png?v=2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png?v=2"
    />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

    <!-- Open Graph -->
    <meta property="og:title" content="Capsule Cabs" />
    <meta
      property="og:description"
      content="Reliable and affordable cab booking service."
    />
    <meta property="og:url" content="https://www.capsulecabs.com" />
    <meta property="og:type" content="website" />

    <!-- Optional but STRONGLY recommended -->
    <meta
      property="og:image"
      content="https://www.capsulecabs.com/og-image.png"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Capsule Cabs" />
    <meta name="twitter:description" content="Reliable cab booking service." />
  </head>

  <body>
    <!-- React App Root -->
    <div id="root"></div>

    <!-- Entry -->
    <script type="module" src="/src/main.tsx"></script>
